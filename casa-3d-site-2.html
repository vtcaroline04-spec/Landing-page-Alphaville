<style>
#casaB{position:relative;width:100%;height:100%;min-height:calc(100vh - 30px);border-radius:12px;overflow:hidden;background:linear-gradient(#4a6bb0,#b99ab0 55%,#f0b88a);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#casaB canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#casaB .c3d-ui{position:absolute;left:0;right:0;bottom:12px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;color:#fff}
#casaB .c3d-ui button{pointer-events:auto;border:0;border-radius:999px;padding:9px 18px;font-size:14px;background:rgba(255,255,255,.22);color:#fff;cursor:pointer}
#casaB .c3d-ui span{font-size:12px;opacity:.85}
</style>
<div id="casaB">
  <canvas id="casaB-canvas"></canvas>
  <div class="c3d-ui"><button id="casaB-btn" type="button">Pausar rotação</button><span>Arraste para girar · pinça ou scroll para zoom</span></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){

(function(){const c=document.createElement('canvas');c.width=256;c.height=128;const x=c.getContext('2d');
 const g=x.createLinearGradient(0,0,0,128);g.addColorStop(0,'#4a5a8c');g.addColorStop(.5,'#b58a96');g.addColorStop(.6,'#e0a070');g.addColorStop(.62,'#2a3320');g.addColorStop(1,'#1a2014');
 x.fillStyle=g;x.fillRect(0,0,256,128);const t=new THREE.CanvasTexture(c);t.mapping=THREE.EquirectangularReflectionMapping;t.encoding=THREE.sRGBEncoding;
 S.environment=new THREE.PMREMGenerator(R).fromEquirectangular(t).texture;})();

 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t}

 stucco:c=>tex((x,w,h)=>{x.fillStyle=c;x.fillRect(0,0,w,h);speck(x,w,h,5000,'rgba(90,85,80,A)',.18);speck(x,w,h,3000,'rgba(255,255,255,A)',.2)}),
 grass:tex((x,w,h)=>{x.fillStyle='#456f2c';x.fillRect(0,0,w,h);for(let i=0;i<9000;i++){x.strokeStyle=`hsl(${rnd(80,105)},${rnd(40,60)}%,${rnd(22,40)}%)`;const a=rnd(0,w),b=rnd(0,h);x.beginPath();x.moveTo(a,b);x.lineTo(a+rnd(-3,3),b+rnd(4,9));x.stroke()}}),
 stone:tex((x,w,h)=>{x.fillStyle='#8c877d';x.fillRect(0,0,w,h);for(let i=0;i<70;i++){const cx=rnd(0,w),cy=rnd(0,h),r=rnd(18,34);x.beginPath();for(let k=0;k<6;k++){const a=k/6*6.28+rnd(-.3,.3);x.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r*.8)}x.closePath();const l=rnd(68,84);x.fillStyle=`hsl(${rnd(35,50)},${rnd(6,14)}%,${l}%)`;x.fill();x.strokeStyle='#6f6a60';x.lineWidth=2;x.stroke()}}),
 wood:tex((x,w,h)=>{x.fillStyle='#9a5230';x.fillRect(0,0,w,h);for(let i=0;i<w;i+=16){x.fillStyle=`hsl(${rnd(18,24)},${rnd(50,60)}%,${rnd(32,40)}%)`;x.fillRect(i,0,14,h);x.fillStyle='#4e2410';x.fillRect(i+14,0,2,h)}speck(x,w,h,1500,'rgba(0,0,0,A)',.2)}),
 tile:tex((x,w,h)=>{x.fillStyle='#ebe7de';x.fillRect(0,0,w,h);speck(x,w,h,2000,'rgba(120,110,95,A)',.12);x.strokeStyle='#c9c3b6';x.lineWidth=2;x.strokeRect(0,0,w,h)}),
 slab:tex((x,w,h)=>{x.fillStyle='#6a6d75';x.fillRect(0,0,w,h);speck(x,w,h,6000,'rgba(255,255,255,A)',.12);speck(x,w,h,4000,'rgba(0,0,0,A)',.15)}),
 pool:tex((x,w,h)=>{x.fillStyle='#2d86b8';x.fillRect(0,0,w,h);x.strokeStyle='#8fcbe3';x.lineWidth=2;for(let i=0;i<=w;i+=32){x.beginPath();x.moveTo(i,0);x.lineTo(i,h);x.moveTo(0,i);x.lineTo(w,i);x.stroke()}speck(x,w,h,2500,'rgba(255,255,255,A)',.12)})
};
T.white=T.stucco('#e8e5df');T.dark=T.stucco('#3c3c40');T.peach=T.stucco('#f0cfae');
const rep=(m,w,h,d,s)=>{m=m.clone();m.map=m.map.clone();m.map.needsUpdate=true;m.map.repeat.set(Math.max(w,d)/s,Math.max(h,Math.min(w,d))/s);return m};
const SM=(map,r=.85,m=0)=>new THREE.MeshStandardMaterial({map,roughness:r,metalness:m});
const PM=(c,r=.6,m=0,em,ei=1.5,op)=>{const k=new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});if(em){k.emissive=new THREE.Color(em);k.emissiveIntensity=ei}if(op){k.transparent=true;k.opacity=op}return k};
const G=new THREE.Group();S.add(G);const H=new THREE.Group();H.position.z=6;G.add(H);
function B(w,h,d,x,y,z,m,s,sh=true){if(s)m=rep(m,w,h,d,s);const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=sh;o.receiveShadow=true;H.add(o);return o}
const mWhite=SM(T.white),mDark=SM(T.dark,.7),mPeach=SM(T.peach),mWood=SM(T.wood,.55),mStone=SM(T.stone,.95),mTile=SM(T.tile,.35),mSlab=SM(T.slab,.9),mGrass=SM(T.grass,1);

const frame=PM(0x161616,.4,.6);
const LED=PM(0xffd8a0,.4,0,0xffa83a,2.6);
const GLOWM=PM(0xffc27a,.9,0,0xff9a30,.9);
// terreno
T.gray=T.stucco('#aaa69e');T.brown=T.stucco('#4b2b26');T.olive=T.stucco('#aaa66c');
const mGray=SM(T.gray),mBrown=SM(T.brown,.75),mOlive=SM(T.olive),mPave=SM(T.slab,.95);
B(46,.3,44,0,-.15,-5,mGrass,6);
// corpo térreo
B(4,6.8,9.5,-5,3.4,-.25,mGray,4);B(1.5,3.3,9,-2.25,1.65,-.5,mGray,4);
B(5.5,3.3,4,3.75,1.65,-3,mGray,4);B(8.5,3,.2,2.75,1.5,-1,mOlive,4);
B(.4,3.3,5,7.2,1.65,1.5,mGray,4);B(8.5,.08,5.2,2.75,.04,1.5,mTile,3);B(.9,2.2,.1,5.3,1.1,-.85,frame);
// janelão da torre
B(2.4,5.4,.1,-5,3.6,4.52,glass,0,false);B(2.3,5.3,.05,-5,3.6,4.4,GLOWM);
[-6.2,-3.8].forEach(x=>B(.1,5.5,.14,x,3.6,4.55,frame));
[.9,2.4,4.4,6.3].forEach(y=>B(2.5,.1,.14,-5,y,4.55,frame));
// porta e degraus com LED
B(1.3,2.9,.14,-2.25,1.45,4.08,mWood,2.5);B(.06,1,.08,-1.75,1.3,4.18,frame);
[0,1,2].forEach(i=>{const y=.42-i*.14,z=5.1+i*1.1;B(2.6,.14,1.1,-2.25,y,z,mTile,3);B(2.6,.04,.05,-2.25,y-.04,z+.56,LED,0,false)});
// piso superior (moldura marrom)
B(10.8,.55,10.2,2.4,3.3,.1,mBrown,5);B(10.8,.5,10.2,2.4,6.6,.1,mBrown,5);
B(10.8,3,.5,2.4,4.95,-4.9,mBrown,5);B(.4,3,5,7.8,4.95,-2.5,mBrown,5);B(.5,3,.5,7.7,4.95,1.5,mBrown,5);
B(10.4,2.9,.15,2.4,4.95,.8,mGray,4);B(2.2,2.8,.12,-1.2,4.95,.95,mWood,2.5);
B(2.4,1.9,.06,3,5,.9,GLOWM);B(2.5,.08,.1,3,4.05,.95,frame);B(2.5,.08,.1,3,5.95,.95,frame);B(.08,1.95,.1,1.8,5,.95,frame);B(.08,1.95,.1,4.2,5,.95,frame);
B(10.2,1.15,.05,2.5,4.0,4.95,glass,0,false);B(10.2,.05,.07,2.5,4.6,4.95,frame);
for(let x=-2.5;x<=7.5;x+=2.5)B(.05,.5,.07,x,3.75,4.95,frame);
for(let i=0;i<4;i++)B(.9,.35,3.8,.5+i*1.5,6.15,2.9,mGray,3);
// downlights
const dl=(x,y,z)=>B(.16,.03,.16,x,y,z,PM(0xfff2cc,.3,0,0xffe2a0,3),0,false);
for(let x=.5;x<=5.5;x+=1.25)for(let z=1.5;z<=3.5;z+=1)dl(x,3.0,z);
// painéis solares
for(let i=0;i<3;i++)for(let j=0;j<2;j++){const p=B(1.6,.06,1,1+i*1.75,7.0,-2.5+j*1.2,PM(0x14202f,.15,.7,0x0a1220,.2),0,false);p.rotation.x=-.25}
// entrada de veículos
B(9.2,.08,8.5,3,.04,8.4,PM(0x7d7366,.95),0,false);
for(let r=0;r<4;r++)for(let c=0;c<2;c++)B(4.3,.1,2,.7+c*4.55,.1,5.5+r*2.15,mTile,3);
B(46,.1,3.5,0,.05,15.8,mPave,3,false);B(46,.11,.9,0,.055,13.7,PM(0xa8453a,.9),0,false);
B(2.4,2.2,.12,-8.8,1.1,4.2,PM(0x1a1a1a,.5,.4));
// ala dos fundos + piscina
B(11.5,3,4.2,.75,1.5,-7.1,mGray,4);B(12.4,.9,5,.75,3.45,-7.1,mBrown,5);
B(4.6,2.4,.08,2.2,1.25,-9.22,GLOWM);B(4.7,.08,.1,2.2,2.5,-9.25,frame);B(4.7,.08,.1,2.2,.05,-9.25,frame);[-.1,2.2,4.5].forEach(x=>B(.08,2.5,.1,x,1.25,-9.25,frame));
B(.9,3,.1,-4.2,1.5,-9.22,mStone,3);B(1.2,.7,.06,-2,1.8,-9.22,frame);B(1,3,.6,5.2,1.5,-9.3,mBrown,5);
B(16,.14,8,0,.07,-13.2,mTile,3);
B(7,.3,5.6,-.5,.15,-13,PM(0xd9d4c8,.9));
const water=B(6.2,.14,4.8,-.5,.2,-13,PM(0x1c5d6b,.06,.1,0x0a3c4a,.6,.86),0,false);
B(6.2,.04,4.8,-.5,.12,-13,SM(T.pool),2.5,false);B(.12,.8,.12,-3.2,.6,-12,PM(0xcfcfcf,.2,.9));B(.5,.1,.12,-2.95,.98,-12,PM(0xcfcfcf,.2,.9));
// muros
for(let s of[-1,1])B(.3,2,30,s*15,1,-2.5,mWhite,5);B(30,2,.3,0,1,-17,mWhite,5);
// plantas
const leafM=PM(0x3e8d3b,.8);
function palm(x,z,h){const t=new THREE.Mesh(new THREE.CylinderGeometry(.07,.12,h,10),PM(0xb9b090,.9));t.position.set(x,h/2,z);t.castShadow=true;H.add(t);
 for(let i=0;i<9;i++){const l=new THREE.Mesh(new THREE.ConeGeometry(.14,2.2,4),leafM);const a=i/9*6.28;l.position.set(x+Math.cos(a)*.9,h-.1,z+Math.sin(a)*.9);l.rotation.set(Math.sin(a)*1.25,0,-Math.cos(a)*1.25);l.castShadow=true;H.add(l)}}
palm(-4.2,8,4.2);palm(-12,6,3.2);
const ring=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.5,.1,28),PM(0xe8e2d4,.95));ring.position.set(-4.2,.05,8);H.add(ring);
for(let i=0;i<5;i++){const a=i*1.26;for(let k=0;k<7;k++){const l=new THREE.Mesh(new THREE.ConeGeometry(.12,.9,4),PM(i%2?0xa8484a:0x5a9a44,.7));const b=k/7*6.28;l.position.set(-4.2+Math.cos(a)*.9+Math.cos(b)*.25,.5,8+Math.sin(a)*.9+Math.sin(b)*.25);l.rotation.set(Math.sin(b)*.8,0,-Math.cos(b)*.8);H.add(l)}}
// montanhas
[[-70,-90,38,0x2a3a35],[10,-110,55,0x263631],[75,-70,40,0x2d3d38],[-100,10,36,0x2a3a35],[100,30,44,0x293935]].forEach(m=>{const h=new THREE.Mesh(new THREE.ConeGeometry(m[2]*1.1,m[2]*1.5,7),new THREE.MeshBasicMaterial({color:0x3c5262}));h.position.set(m[0]*1.7,m[2]*.65-2,m[1]*1.7);G.add(h)});
// brilho
const gt=tex((x,w,h)=>{const g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,210,140,.9)');g.addColorStop(1,'rgba(255,170,70,0)');x.fillStyle=g;x.fillRect(0,0,128,128)},128,128);
function glow(x,y,z,s){const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:gt,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:.65}));sp.scale.set(s,s,1);sp.position.set(x,y,z);H.add(sp)}
[0,1,2].forEach(i=>glow(-2.25,.4-i*.14,5.7+i*1.1,2));
for(let x=.5;x<=5.5;x+=1.25)glow(x,2.95,2.5,1.3);
[.5,1.5,2.5,3.5].forEach(z=>{B(.2,.4,.2,6.9,2,z,PM(0x111111,.4,.6));glow(6.8,2.2,z,1.1)});
glow(-5,3.6,4.6,5);glow(3,5,1.2,3);glow(2.2,1.3,-9.3,4);
// luzes
S.add(new THREE.HemisphereLight(0x9aa8d8,0x3a4a2a,.5));
const sun=new THREE.DirectionalLight(0xffcfa0,1.1);sun.position.set(18,24,20);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-28,right:28,top:28,bottom:-28,near:1,far:90});sun.shadow.bias=-.0005;S.add(sun);
[[3,2.6,2.5,0xffd9a0,1.2],[-2.25,.8,6.5,0xffa24a,.8],[-5,3.5,3,0xffc27a,1],[-.5,.8,-13,0x7fd4ff,.8]].forEach(p=>{const l=new THREE.PointLight(p[3],p[4],10,2);l.position.set(p[0],p[1],p[2]);H.add(l)});
// controle
let rot=.5,pitch=.3,auto=true,drag=false,lx=0,ly=0,pd=0;
const ptr=new Map(),clampD=v=>Math.max(14,Math.min(70,v));
cv.addEventListener('pointerdown',e=>{ptr.set(e.pointerId,[e.clientX,e.clientY]);cv.setPointerCapture(e.pointerId);drag=true;lx=e.clientX;ly=e.clientY;if(ptr.size==2){const[a,b]=[...ptr.values()];pd=Math.hypot(a[0]-b[0],a[1]-b[1])}cv.style.cursor='grabbing'});
const up=e=>{ptr.delete(e.pointerId);if(ptr.size==1){const p=[...ptr.values()][0];lx=p[0];ly=p[1]}if(!ptr.size){drag=false;cv.style.cursor='grab'}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;ptr.set(e.pointerId,[e.clientX,e.clientY]);
 if(ptr.size==2){const[a,b]=[...ptr.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd&&d)dist=clampD(dist*pd/d);pd=d;return}
 rot+=(e.clientX-lx)*.01;pitch=Math.max(.04,Math.min(1.1,pitch+(e.clientY-ly)*.005));lx=e.clientX;ly=e.clientY});
cv.addEventListener('wheel',e=>{e.preventDefault();dist=clampD(dist+e.deltaY*.03)},{passive:false});
const btn=document.getElementById('casaB-btn');btn.onclick=()=>{auto=!auto;btn.textContent=auto?'Pausar rotação':'Retomar rotação'};

(function loop(t){requestAnimationFrame(loop);
 if(auto&&!drag)rot+=.005;G.rotation.y=rot;
 water.position.y=.2+Math.sin(t*.0015)*.008;
 cam.position.set(0,Math.sin(pitch)*dist+3.5,Math.cos(pitch)*dist);cam.lookAt(0,3,0);R.render(S,cam)})(0);
})();
