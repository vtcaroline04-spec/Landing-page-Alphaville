<!-- ===== CASA 3D 360° — cole este bloco inteiro no ponto da página onde quer o modelo ===== -->
<style>
#casa3d{position:relative;width:100%;height:100%;min-height:calc(100vh - 30px);border-radius:12px;overflow:hidden;background:linear-gradient(#39466e,#7d6a82 58%,#d99a66);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#casa3d canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#casa3d .c3d-ui{position:absolute;left:0;right:0;bottom:12px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;color:#fff}
#casa3d .c3d-ui button{pointer-events:auto;border:0;border-radius:999px;padding:9px 18px;font-size:14px;background:rgba(255,255,255,.22);color:#fff;cursor:pointer}
#casa3d .c3d-ui span{font-size:12px;opacity:.85}
</style>
<div id="casa3d">
  <canvas id="casa3d-canvas"></canvas>
  <div class="c3d-ui"><button id="casa3d-btn" type="button">Pausar rotação</button><span>Arraste para girar · pinça ou scroll para zoom</span></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const wrap=document.getElementById('casa3d');
const cv=document.getElementById('casa3d-canvas');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
R.outputEncoding=THREE.sRGBEncoding;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.05;
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
const S=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(42,1,.1,400);
let dist=34;
// ambiente (reflexos de entardecer)
(function(){const c=document.createElement('canvas');c.width=256;c.height=128;const x=c.getContext('2d');
 const g=x.createLinearGradient(0,0,0,128);g.addColorStop(0,'#4a5a8c');g.addColorStop(.5,'#b58a96');g.addColorStop(.6,'#e0a070');g.addColorStop(.62,'#2a3320');g.addColorStop(1,'#1a2014');
 x.fillStyle=g;x.fillRect(0,0,256,128);const t=new THREE.CanvasTexture(c);t.mapping=THREE.EquirectangularReflectionMapping;t.encoding=THREE.sRGBEncoding;
 S.environment=new THREE.PMREMGenerator(R).fromEquirectangular(t).texture;})();
// texturas procedurais
function tex(fn,w=256,h=256){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');fn(x,w,h);
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t}
const rnd=(a,b)=>a+Math.random()*(b-a);
function speck(x,w,h,n,col,a){for(let i=0;i<n;i++){x.fillStyle=col.replace('A',(Math.random()*a).toFixed(3));x.fillRect(Math.random()*w,Math.random()*h,rnd(1,3),rnd(1,3))}}
const T={
 stucco:c=>tex((x,w,h)=>{x.fillStyle=c;x.fillRect(0,0,w,h);speck(x,w,h,5000,'rgba(90,85,80,A)',.18);speck(x,w,h,3000,'rgba(255,255,255,A)',.2)}),
 grass:tex((x,w,h)=>{x.fillStyle='#456f2c';x.fillRect(0,0,w,h);for(let i=0;i<9000;i++){x.strokeStyle=`hsl(${rnd(80,105)},${rnd(40,60)}%,${rnd(22,40)}%)`;const a=rnd(0,w),b=rnd(0,h);x.beginPath();x.moveTo(a,b);x.lineTo(a+rnd(-3,3),b+rnd(4,9));x.stroke()}}),
 stone:tex((x,w,h)=>{x.fillStyle='#8c877d';x.fillRect(0,0,w,h);for(let i=0;i<70;i++){const cx=rnd(0,w),cy=rnd(0,h),r=rnd(18,34);x.beginPath();for(let k=0;k<6;k++){const a=k/6*6.28+rnd(-.3,.3);x.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r*.8)}x.closePath();const l=rnd(68,84);x.fillStyle=`hsl(${rnd(35,50)},${rnd(6,14)}%,${l}%)`;x.fill();x.strokeStyle='#6f6a60';x.lineWidth=2;x.stroke()}}),
 wood:tex((x,w,h)=>{x.fillStyle='#9a5230';x.fillRect(0,0,w,h);for(let i=0;i<w;i+=16){x.fillStyle=`hsl(${rnd(18,24)},${rnd(50,60)}%,${rnd(32,40)}%)`;x.fillRect(i,0,14,h);x.fillStyle='#4e2410';x.fillRect(i+14,0,2,h)}speck(x,w,h,1500,'rgba(0,0,0,A)',.2)}),
 tile:tex((x,w,h)=>{x.fillStyle='#ebe7de';x.fillRect(0,0,w,h);speck(x,w,h,2000,'rgba(120,110,95,A)',.12);x.strokeStyle='#c9c3b6';x.lineWidth=2;x.strokeRect(0,0,w,h)}),
 slab:tex((x,w,h)=>{x.fillStyle='#6a6d75';x.fillRect(0,0,w,h);speck(x,w,h,6000,'rgba(255,255,255,A)',.12);speck(x,w,h,4000,'rgba(0,0,0,A)',.15)}),
 pool:tex((x,w,h)=>{x.fillStyle='#2d86b8';x.fillRect(0,0,w,h);x.strokeStyle='#8fcbe3';x.lineWidth=2;for(let i=0;i<=w;i+=32){x.beginPath();x.moveTo(i,0);x.lineTo(i,h);x.moveTo(0,i);x.lineTo(w,i);x.stroke()}speck(x,w,h,2500,'rgba(255,255,255,A)',.12)})
};
T.white=T.stucco('#e8e5df');T.dark=T.stucco('#3c3c40');T.peach=T.stucco('#f0cfae');
const rep=(m,w,h,d,s)=>{m=m.clone();m.map=m.map.clone();m.map.needsUpdate=true;m.map.repeat.set(Math.max(w,d)/s,Math.max(h,Math.min(w,d))/s);return m};
const SM=(map,r=.85,m=0)=>new THREE.MeshStandardMaterial({map,roughness:r,metalness:m});
const PM=(c,r=.6,m=0,em,ei=1.5,op)=>{const k=new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});if(em){k.emissive=new THREE.Color(em);k.emissiveIntensity=ei}if(op){k.transparent=true;k.opacity=op}return k};
const G=new THREE.Group();S.add(G);
function B(w,h,d,x,y,z,m,s,sh=true){if(s)m=rep(m,w,h,d,s);const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=sh;o.receiveShadow=true;G.add(o);return o}
const mWhite=SM(T.white),mDark=SM(T.dark,.7),mPeach=SM(T.peach),mWood=SM(T.wood,.55),mStone=SM(T.stone,.95),mTile=SM(T.tile,.35),mSlab=SM(T.slab,.9),mGrass=SM(T.grass,1);
const glass=new THREE.MeshPhysicalMaterial({color:0xcfeaf2,roughness:.05,metalness:0,transparent:true,opacity:.28,envMapIntensity:2});
const frame=PM(0x161616,.4,.6);
const LED=PM(0xffd8a0,.4,0,0xffa83a,2.6);
const GLOWM=PM(0xffc27a,.9,0,0xff9a30,.9);
// terreno
B(40,.3,38,0,-.15,-1,mGrass,6);
B(16,.14,11,0,.07,-9.5,mTile,3);B(16,.14,3,0,.07,5.9,mTile,3);
// térreo
B(6,3,9,3,1.5,0,mWhite,4);B(6,3,6,-3,1.5,-1.5,mWhite,4);
B(6,2.9,.15,-3,1.5,1.5,mPeach,4);B(1,2.2,.12,-.9,1.15,1.62,frame);
B(6,.12,3,-3,.1,3,mTile,3);
// porta ripada + painel de pedra + degraus
B(1.7,2.6,.14,.9,1.3,4.56,mWood,2.5);B(.08,.7,.1,1.55,1.2,4.66,PM(0x111111,.3,.8));
B(2.6,3,.18,3.4,1.5,4.56,mStone,3);
B(4,.12,1.4,1.9,.08,5.4,mTile,3);
// piso superior: moldura
B(12.7,.45,9.9,0,3.2,0,mDark,6);B(12.7,.5,9.9,0,6.4,0,mDark,6);
B(.5,3,9.9,-6.2,4.8,0,mDark,6);B(.5,3,9.9,6.2,4.8,0,mDark,6);B(12,3,.5,0,4.8,-4.7,mDark,6);
B(11.9,2.8,.15,0,4.8,3.2,mPeach,4);
// janelas / vidros com esquadria
B(2.4,1.9,.06,-3,4.9,3.3,GLOWM);B(2.5,.08,.1,-3,3.95,3.35,frame);B(2.5,.08,.1,-3,5.85,3.35,frame);B(.08,1.95,.1,-4.2,4.9,3.35,frame);B(.08,1.95,.1,-1.8,4.9,3.35,frame);B(.05,1.9,.1,-3,4.9,3.38,frame);
B(2,2.8,.12,-.2,4.8,3.3,mWood,2.5);
B(2.4,2.8,.2,2.4,4.8,3.3,mStone,3);
B(1.7,2.8,.1,5,4.8,4.7,GLOWM);B(.08,2.85,.14,5,4.8,4.75,frame);B(1.75,.08,.14,5,4.8,4.75,frame);
B(11.8,1.15,.05,0,3.95,4.9,glass,0,false);
B(11.8,.05,.07,0,4.55,4.9,frame);for(let i=-5;i<=5;i+=2.2)B(.05,.45,.07,i,3.75,4.9,PM(0x222222,.3,.8));
// LEDs
const led=(w,h,d,x,y,z)=>B(w,h,d,x,y,z,LED,0,false);
led(11.7,.07,.07,0,6.12,4.8);led(11.7,.07,.07,0,6.0,3.6);led(.07,.07,1.3,-5.9,6.1,4.1);led(.07,.07,1.3,5.9,6.1,4.1);
led(.07,2.8,.07,5.9,4.8,4.85);
led(4,.06,.06,-3,2.92,2.6);led(2.6,.06,.06,-3,2.92,1.9);led(.06,.06,.7,-4.3,2.92,2.25);led(.06,.06,.7,-1.7,2.92,2.25);
// fundos: área gourmet, churrasqueira, vidro, piscina
B(5,2.4,.1,0,1.3,-4.55,GLOWM);B(5.1,.08,.14,0,2.5,-4.58,frame);
B(2,2.7,.7,-4.6,1.35,-4.75,PM(0xa84a28,.8),0,true);B(1.2,.7,.2,-4.6,1.3,-4.4,PM(0x111111,.5));
B(8.8,.3,5.8,0,.2,-10,PM(0xd5c3a2,.9));
const water=B(8,.2,5,0,.3,-10,PM(0x2f93c9,.08,.1,0x0d5a88,.7,.82),0,false);
B(8,.04,5,0,.19,-10,SM(T.pool,.2),2.5,false);
for(let s of[-1,1]){B(.08,.1,.08,s*3.9,.42,-8,PM(0xffffff,.3,0,0xaee4ff,2),0,false)}
B(2.4,1.3,.7,-8,.7,-8,mStone,3);
// muros
for(let s of[-1,1])B(.3,2,25,s*15.5,1,-6,mWhite,5);
B(31,2,.3,0,1,-19,mWhite,5);for(let i=-2;i<=2;i++)B(1,2,.38,i*5.5,1,-19,PM(0xa4492a,.85));
B(.3,2,.3,0,0,0,mWhite,0,false);
// calçada
for(let i=0;i<4;i++){B(6.8,.12,1.75,-6,.09,6.8+i*1.95,mSlab,3);B(2,.12,1.7,.4,.1,6.8+i*1.95,mTile,3)}
B(3,.14,5,-6,.09,6.5,mSlab,3,false);
// plantas
const leafM=PM(0x3e8d3b,.8);
function palm(x,z,h){const t=new THREE.Mesh(new THREE.CylinderGeometry(.08,.14,h,10),PM(0x8a6d4a,.9));t.position.set(x,h/2,z);t.castShadow=true;G.add(t);
 for(let i=0;i<9;i++){const l=new THREE.Mesh(new THREE.ConeGeometry(.14,2.4,4),leafM);const a=i/9*6.28;l.position.set(x+Math.cos(a)*.95,h-.1,z+Math.sin(a)*.95);l.rotation.set(Math.sin(a)*1.25,0,-Math.cos(a)*1.25);l.castShadow=true;G.add(l)}}
palm(6,8.5,4.4);palm(-11,9,3.6);palm(9.5,6.5,3.2);palm(-12,-3,3.8);
function brom(x,z,c){for(let i=0;i<8;i++){const l=new THREE.Mesh(new THREE.ConeGeometry(.13,1.1,4),PM(c,.7));const a=i/8*6.28;l.position.set(x+Math.cos(a)*.3,.45,z+Math.sin(a)*.3);l.rotation.set(Math.sin(a)*.8,0,-Math.cos(a)*.8);l.castShadow=true;G.add(l)}}
[[5.2,7.5],[6.6,8.8],[8,7.6],[7.2,10],[5,10]].forEach((p,i)=>brom(p[0],p[1],i%2?0xa3333c:0x3f8a46));
B(2.6,.5,.7,3.4,.25,5.6,PM(0x45454a,.8));
for(let i=-4;i<=4;i++){const g=new THREE.Mesh(new THREE.ConeGeometry(.09,.8,4),PM(0x6ca83e,.8));g.position.set(-2.6,.4,7+i*1.1);G.add(g)}
// montanhas ao fundo
[[-70,-90,38,0x2a3a35],[10,-110,55,0x263631],[75,-70,40,0x2d3d38],[-100,10,36,0x2a3a35],[100,30,44,0x293935]].forEach(m=>{const h=new THREE.Mesh(new THREE.ConeGeometry(m[2]*1.1,m[2]*1.5,7),new THREE.MeshBasicMaterial({color:0x3c5262}));h.position.set(m[0]*1.7,m[2]*.65-2,m[1]*1.7);G.add(h)});
// brilho dos LEDs
const gt=tex((x,w,h)=>{const g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,200,120,.9)');g.addColorStop(1,'rgba(255,160,60,0)');x.fillStyle=g;x.fillRect(0,0,128,128)},128,128);
function glow(x,y,z,s){const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:gt,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:.7}));sp.scale.set(s,s,1);sp.position.set(x,y,z);G.add(sp)}
for(let z=-3.5;z<=3.6;z+=1.8)glow(6.5,6.2,z,1.8);
[-4,0,4].forEach(x=>glow(x,6.1,4.85,2.2));glow(-3,2.9,2.3,3);glow(5,4.8,4.9,3);glow(-3,4.9,3.4,2.6);
// luzes
S.add(new THREE.HemisphereLight(0x9aa8d8,0x3a4a2a,.45));
const sun=new THREE.DirectionalLight(0xffcfa0,1.1);sun.position.set(18,24,20);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-26,right:26,top:26,bottom:-26,near:1,far:80});sun.shadow.bias=-.0005;S.add(sun);
[[-3,2.5,3.5],[0,5.5,6.5],[5,5,6.5],[6.2,3.5,0]].forEach(p=>{const l=new THREE.PointLight(0xffa24a,1.3,12,2);l.position.set(...p);G.add(l)});
const pool=new THREE.PointLight(0x7fd4ff,1,9,2);pool.position.set(0,.8,-10);G.add(pool);
// controle
let rot=.5,pitch=.3,auto=true,drag=false,lx=0,ly=0,pd=0;
const ptr=new Map(),clampD=v=>Math.max(14,Math.min(70,v));
cv.addEventListener('pointerdown',e=>{ptr.set(e.pointerId,[e.clientX,e.clientY]);cv.setPointerCapture(e.pointerId);drag=true;lx=e.clientX;ly=e.clientY;if(ptr.size==2){const[a,b]=[...ptr.values()];pd=Math.hypot(a[0]-b[0],a[1]-b[1])}cv.style.cursor='grabbing'});
const up=e=>{ptr.delete(e.pointerId);if(ptr.size==1){const p=[...ptr.values()][0];lx=p[0];ly=p[1]}if(!ptr.size){drag=false;cv.style.cursor='grab'}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;ptr.set(e.pointerId,[e.clientX,e.clientY]);
 if(ptr.size==2){const[a,b]=[...ptr.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd&&d)dist=clampD(dist*pd/d);pd=d;return}
 rot+=(e.clientX-lx)*.01;pitch=Math.max(.04,Math.min(1.1,pitch+(e.clientY-ly)*.005));lx=e.clientX;ly=e.clientY});
cv.addEventListener('wheel',e=>{e.preventDefault();dist=clampD(dist+e.deltaY*.03)},{passive:false});
const btn=document.getElementById('casa3d-btn');btn.onclick=()=>{auto=!auto;btn.textContent=auto?'Pausar rotação':'Retomar rotação'};
function resize(){const w=wrap.clientWidth,h=wrap.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
new ResizeObserver(resize).observe(wrap);resize();
(function loop(t){requestAnimationFrame(loop);
 if(auto&&!drag)rot+=.005;G.rotation.y=rot;
 water.position.y=.3+Math.sin(t*.0015)*.008;
 cam.position.set(0,Math.sin(pitch)*dist+3.5,Math.cos(pitch)*dist);cam.lookAt(0,3,-2);R.render(S,cam)})(0);
})();
</script>
